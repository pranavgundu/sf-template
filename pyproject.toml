[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "sf-template"
version = "1.0.0"
description = "Science Fair Template: configurable starters for science fairs and independent research."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = []

[project.scripts]
sf-template = "sf_template.cli:main"

[project.urls]
Repository = "https://github.com/pranavgundu/sf-template"
Issues = "https://github.com/pranavgundu/sf-template/issues"

[tool.hatch.build.targets.wheel]
packages = ["sf_template"]

[tool.hatch.build.targets.wheel.force-include]
"template" = "sf_template/assets/template"
"tracks" = "sf_template/assets/tracks"

[tool.hatch.build.targets.sdist]
include = ["sf_template", "template", "tracks", "tests", "examples", "README.md", "LICENSE", "pyproject.toml"]
