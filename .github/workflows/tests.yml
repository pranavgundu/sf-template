name: Check template
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ['3.11', '3.14']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m unittest discover -s tests -v
      - uses: astral-sh/setup-uv@v6
      - run: uv build
      - run: uvx --from . sf-template analyze examples/paper-bridges/measurements.csv --output smoke-results
      - run: uvx --from . sf-template init smoke-project --title "Packaging check" --track computational
      - run: python -m project.main
        working-directory: smoke-project
